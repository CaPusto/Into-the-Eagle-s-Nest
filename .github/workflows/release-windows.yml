name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download SDL3 Development Pack
      run: |
        curl -Lf -o sdl3_devel.zip 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip'

    - name: Extract SDL3 Development Pack
      shell: powershell
      run: |
        Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "C:\SDL3"

    - name: Configure CMake
      shell: powershell
      run: |
        # 1. Отключаем вызовы pkg-config, которые ломают MSVC
        (Get-Content CMakeLists.txt) `
          -replace 'find_package\(PkgConfig REQUIRED\)', '# find_package(PkgConfig REQUIRED)' `
          -replace 'pkg_check_modules\(SDL3 REQUIRED sdl3\)', '# pkg_check_modules(SDL3 REQUIRED sdl3)' `
          | Set-Content CMakeLists.txt

        # 2. Исправляем проблему неконстантных инициализаторов в embedded_assets.c (ошибка C2099)
        Add-Content CMakeLists.txt "`nset_source_files_properties(src/assets/embedded_assets.c PROPERTIES COMPILE_FLAGS /TP)"

        # 3. Передаем пути к инклудам и .lib файлу официального SDK напрямую через переменные окружения CMake.
        # Флаг CMAKE_CXX_FLAGS / CMAKE_C_FLAGS со значением /I принудительно заставит MSVC видеть заголовочные файлы SDL3,
        # а CMAKE_EXE_LINKER_FLAGS свяжет исполняемые файлы с библиотекой импорта.
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
          -DCMAKE_C_FLAGS="/I C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/include" `
          -DCMAKE_CXX_FLAGS="/I C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/include" `
          -DCMAKE_EXE_LINKER_FLAGS="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/lib/x64/SDL3.lib"

    - name: Build Project
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
