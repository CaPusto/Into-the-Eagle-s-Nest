name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MinGW)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSYS2 Environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-gcc

    - name: Download SDL3 Development Pack for MinGW
      shell: msys2 {0}
      run: |
        curl -Lf -o sdl3_mingw.zip 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-mingw.zip'
        unzip sdl3_mingw.zip
        # Исправлен путь: файлы копируются из реально созданной папки SDL3-3.4.18
        cp -r SDL3-3.4.18/x86_64-w64-mingw32/* /mingw64/

    - name: Build Project with MinGW
      shell: msys2 {0}
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"
        cmake --build build

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
