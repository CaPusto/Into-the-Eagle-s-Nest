name: Release Windows

on:
  shell: search
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download SDL3 Development Pack
      run: |
        curl -L -o sdl3_devel.zip 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip'

    - name: Extract SDL3 Development Pack
      shell: powershell
      run: |
        Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "C:\SDL3"

    - name: Configure CMake
      shell: powershell
      run: |
        # На Windows (MSVC) pkg-config не нужен. На лету комментируем строки поиска 
        # PkgConfig и вызова pkg_check_modules в CMakeLists.txt с помощью PowerShell
        (Get-Content CMakeLists.txt) `
          -replace 'find_package\(PkgConfig REQUIRED\)', '# find_package(PkgConfig REQUIRED)' `
          -replace 'pkg_check_modules\(SDL3 REQUIRED sdl3\)', '# pkg_check_modules(SDL3 REQUIRED sdl3)' `
          | Set-Content CMakeLists.txt
        
        # Запускаем конфигурацию, передавая пути к скачанному SDK напрямую через переменные
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DSDL3_DIR="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/cmake" `
          -DSDL3_INCLUDE_DIRS="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/include" `
          -DSDL3_LIBRARIES="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/lib/x64/SDL3.lib"

    - name: Build Project
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
