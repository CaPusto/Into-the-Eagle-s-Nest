name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone SDL3 Source
      run: |
        git clone 'https://github.com/libsdl-org/SDL' --depth=1 -b main

    - name: Build and Install SDL3 from Source (Windows)
      shell: powershell
      run: |
        cmake -B SDL/build -S SDL -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DCMAKE_INSTALL_PREFIX="C:/SDL3_Built"
        cmake --build SDL/build --config Release --target install

    - name: Configure CMake for Project
      shell: powershell
      run: |
        # 1. Отключаем вызовы pkg-config, которые ломают MSVC
        (Get-Content CMakeLists.txt) `
          -replace 'find_package\(PkgConfig REQUIRED\)', '# find_package(PkgConfig REQUIRED)' `
          -replace 'pkg_check_modules\(SDL3 REQUIRED sdl3\)', '# pkg_check_modules(SDL3 REQUIRED sdl3)' `
          | Set-Content CMakeLists.txt

        # 2. Исправляем проблему инклудов: принудительно заменяем пустую переменную SDL3_INCLUDE_DIRS
        # на реальный физический путь к инклудам собранной SDL3
        (Get-Content CMakeLists.txt) `
          -replace 'include_directories\(\$\{SDL3_INCLUDE_DIRS\}\)', 'include_directories("C:/SDL3_Built/include")' `
          | Set-Content CMakeLists.txt

        # 3. Добавляем .lib файл собранной SDL3 напрямую в линковку таргетов игры и mapview
        Add-Content CMakeLists.txt "`ntarget_link_libraries(eaglenest PRIVATE `"C:/SDL3_Built/lib/SDL3.lib`")"
        Add-Content CMakeLists.txt "`ntarget_link_libraries(mapview PRIVATE `"C:/SDL3_Built/lib/SDL3.lib`")"

        # 4. Исправляем проблему неконстантных инициализаторов в embedded_assets.c (ошибка C2099)
        Add-Content CMakeLists.txt "`nset_source_files_properties(src/assets/embedded_assets.c PROPERTIES COMPILE_FLAGS /TP)"

        # Запускаем конфигурацию
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

    - name: Build Project
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
