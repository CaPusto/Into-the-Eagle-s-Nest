name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download SDL3 Development Pack
      # Скачиваем официальный стабильный пакет разработки SDL3 для MSVC
      run: |
        curl -L -o sdl3_devel.zip 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip'

    - name: Extract SDL3 Development Pack
      shell: powershell
      run: |
        Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "C:\SDL3"

    - name: Configure CMake
      shell: powershell
      run: |
        # Конфигурируем проект через MSVC. Мы явно передаем путь к скачанному SDK 
        # и отключаем PkgConfig, так как для компилятора Visual Studio он не нужен.
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/cmake" -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

    - name: Build Project
      shell: powershell
      run: |
        # Запускаем сборку бинарников игры (eaglenest.exe и mapview.exe)
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        # Принудительно заменяем DLL в папке dist на ВАШУ собственную из каталога libs
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        # Упаковываем готовую папку dist со всеми ассетами, exe-файлами и вашей DLL в архив
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
