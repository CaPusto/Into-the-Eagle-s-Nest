name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download SDL3 Development Pack
      run: |
        curl -L -o sdl3_devel.zip 'https://github.com'

    - name: Extract SDL3 Development Pack
      shell: powershell
      run: |
        Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "C:\SDL3"

    - name: Configure CMake
      shell: powershell
      run: |
        # 1. Комментируем вызовы pkg-config
        (Get-Content CMakeLists.txt) `
          -replace 'find_package\(PkgConfig REQUIRED\)', '# find_package(PkgConfig REQUIRED)' `
          -replace 'pkg_check_modules\(SDL3 REQUIRED sdl3\)', '# pkg_check_modules(SDL3 REQUIRED sdl3)' `
          | Set-Content CMakeLists.txt

        # 2. На лету внедряем костыль для MSVC, перенаправляя переменную путей инклудов 
        # на сгенерированную официальным CMake-модулем SDL3
        (Get-Content CMakeLists.txt) `
          -replace 'include_directories\(\$\{SDL3_INCLUDE_DIRS\}\)', 'include_directories(${SDL3_INCLUDE_DIR})' `
          | Set-Content CMakeLists.txt

        # 3. Решаем проблему "initializer is not a constant": 
        # заставляем MSVC компилировать embedded_assets.c как C++ файл с помощью свойства компилятора
        Add-Content CMakeLists.txt "`nset_source_files_properties(src/assets/embedded_assets.c PROPERTIES COMPILE_FLAGS /TP)"

        # Запускаем конфигурацию, явно передавая правильный путь к cmake-модулю скачанного официального VC SDK
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DSDL3_DIR="C:/SDL3/SDL3-devel-3.4.18-VC/SDL3-3.4.18/cmake" `
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

    - name: Build Project
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
