name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone SDL3 Source
      run: |
        git clone 'https://github.com/libsdl-org/SDL' --depth=1 -b main

    - name: Build and Install SDL3 from Source (Windows)
      shell: powershell
      run: |
        cmake -B SDL/build -S SDL -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DCMAKE_INSTALL_PREFIX="C:/SDL3_Built"
        cmake --build SDL/build --config Release --target install

    - name: Configure CMake for Project
      shell: powershell
      run: |
        # 1. Disable pkg-config
        (Get-Content CMakeLists.txt) `
          -replace 'find_package\(PkgConfig REQUIRED\)', '# find_package(PkgConfig REQUIRED)' `
          -replace 'pkg_check_modules\(SDL3 REQUIRED sdl3\)', '# pkg_check_modules(SDL3 REQUIRED sdl3)' `
          | Set-Content CMakeLists.txt

        # 2. Remove Unix math library linking
        (Get-Content CMakeLists.txt) `
          -replace 'target_link_libraries\(eaglenest \$\{SDL3_LIBRARIES\} m\)', 'target_link_libraries(eaglenest ${SDL3_LIBRARIES})' `
          -replace 'target_link_libraries\(mapview \$\{SDL3_LIBRARIES\} m\)', 'target_link_libraries(mapview ${SDL3_LIBRARIES})' `
          | Set-Content CMakeLists.txt

        # 3. Inject MSVC-specific options directly into CMake targets to fix C2099 and WinMain issues.
        # We compile embedded_assets.c as C++ (/TP) but wrap target link options to resolve entry points.
        Add-Content CMakeLists.txt "`nif(MSVC)"
        Add-Content CMakeLists.txt "`n  set_source_files_properties(src/assets/embedded_assets.c PROPERTIES COMPILE_FLAGS /TP)"
        Add-Content CMakeLists.txt "`n  target_compile_definitions(eaglenest PRIVATE _CRT_SECURE_NO_WARNINGS)"
        Add-Content CMakeLists.txt "`n  target_compile_definitions(mapview PRIVATE _CRT_SECURE_NO_WARNINGS)"
        Add-Content CMakeLists.txt "`n  target_link_options(eaglenest PRIVATE /ENTRY:mainCRTStartup /SUBSYSTEM:CONSOLE)"
        Add-Content CMakeLists.txt "`n  target_link_options(mapview PRIVATE /ENTRY:mainCRTStartup /SUBSYSTEM:CONSOLE)"
        Add-Content CMakeLists.txt "`nendif()"

        # 4. Inject extern "C" directly into tools/convert_assets.c so it generates the header with proper C linkages every time
        (Get-Content tools/convert_assets.c) `
          -replace 'fprintf\(h, "#ifndef EMBEDDED_ASSETS_H\\n"\);', 'fprintf(h, "#ifndef EMBEDDED_ASSETS_H\n#ifdef __cplusplus\nextern \"C\" {\n#endif\n");' `
          -replace 'fprintf\(h, "#endif // EMBEDDED_ASSETS_H\\n"\);', 'fprintf(h, "#ifdef __cplusplus\n}\n#endif\n#endif // EMBEDDED_ASSETS_H\n");' `
          | Set-Content tools/convert_assets.c

        # 5. Create include and link paths injection
        @"
        include_directories("C:/SDL3_Built/include")
        link_libraries("C:/SDL3_Built/lib/SDL3.lib")
        set(SDL3_LIBRARIES "C:/SDL3_Built/lib/SDL3.lib" CACHE INTERNAL "")
        "@ | Set-Content "C:/inject.cmake"

        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON `
          -DCMAKE_PROJECT_INCLUDE_BEFORE="C:/inject.cmake"

    - name: Disable TreatWarningsAsErrors in Projects
      shell: powershell
      run: |
        Get-ChildItem -Path build -Filter *.vcxproj -Recurse | ForEach-Object {
          (Get-Content $_.FullName) `
            -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' `
            | Set-Content $_.FullName
        }

    - name: Build Project
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Deploy Your Local SDL3.dll
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    - name: Package Release Directory
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../eaglenest-windows-x64.zip" -Force

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
