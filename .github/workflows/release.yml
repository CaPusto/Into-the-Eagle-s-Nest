name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write # Required to create a release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents one OS failure from cancelling other OS builds
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev

      # --- MACOS DEPENDENCIES ---
      - name: Install macOS Build Tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # --- WINDOWS MSYS2 SETUP ---
      - name: Setup MSYS2 and Dependencies on Windows
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-sdl3

      # --- SETUP SDL3 FOR UNIX (Linux/macOS only) ---
      - name: Setup SDL3 (Unix)
        if: matrix.os != 'windows-latest'
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest

      # --- COMPILATION ---
      # Linux and macOS compilation
      - name: Configure and Build (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          cmake --build .

      # Windows compilation inside the previously configured MSYS2 UCRT64 environment
      - name: Configure and Build (Windows UCRT64)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          cmake --build .
          
          # Copy the production-ready SDL3.dll from MSYS2 alongside your game executable
          cp /ucrt64/bin/SDL3.dll dist/ 2>/dev/null || true

      # --- PACKAGING ---
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Temporarily store the created archives so the next release job can access them
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
