name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускает сборку при создании тегов вроде v1.0.0, v1.1.0-beta

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- НАСТРОЙКА ЗАВИСИМОСТЕЙ ---
      
      # Linux: Ставим SDL3 из официального PPA или собираем (в ubuntu-latest SDL3 может отсутствовать в apt, поэтому ставим зависимости для сборки)
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev libaudioio-dev

      # Windows: Используем vcpkg для быстрой установки SDL3
      - name: Install Windows Dependencies (vcpkg)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install sdl3:x64-windows

      # macOS: Ставим через Homebrew
      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja sdl3

      # --- СБОРКА ПРОЕКТА ---

      # Сборка под Linux / macOS
      - name: Configure and Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja

      # Сборка под Windows (интеграция с vcpkg)
      - name: Configure and Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          ninja

      # --- УПАКОВКА АРТЕФАКТОВ ---

      # Для Windows нужно убедиться, что SDL3.dll лежит рядом с exe (ваша CMake конфигурация должна это делать, но подстрахуемся)
      - name: Prepare Windows Package
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path "C:/vcpkg/packages/sdl3_x64-windows/bin/SDL3.dll") {
            Copy-Item "C:/vcpkg/packages/sdl3_x64-windows/bin/SDL3.dll" -Destination "${{ matrix.asset_path }}"
          }

      # Архивируем бинарники вместе с папкой assets
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Временное сохранение артефактов для шага релиза
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
