name: Create Release Artifacts

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тегов, например v1.0.0, v2.1-alpha

permissions:
  contents: write # Разрешение на создание релизов и загрузку артефактов

jobs:
  build-and-release:
    name: Build and Upload Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux-x64
            script: ./build_linux.sh
          - os: macos-latest
            artifact_name: eaglenest-macos-universal
            script: ./build_macos.sh --universal
          - os: windows-latest
            artifact_name: eaglenest-windows-x64
            script: msvc # Маркер для кастомного шага MSVC

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ШАГ СБОРКИ ДЛЯ LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config gcc libsdl3-dev

    - name: Build Linux Project
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x ${{ matrix.script }}
        ${{ matrix.script }}

    # --- ШАГ СБОРКИ ДЛЯ MACOS ---
    - name: Install macOS Dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake pkg-config sdl3

    - name: Build macOS Project
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x ${{ matrix.script }}
        ${{ matrix.script }}

    # --- ШАГ СБОРКИ ДЛЯ WINDOWS (MSVC) ---
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/libs"

    - name: Build Project (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Prepare Windows Dist Folder
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Копируем локальную скомпилированную DLL из папки libs в dist рядом с .exe
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    # --- УПАКОВКА АРТЕФАКТОВ ПОД КАЖДУЮ ОС ---
    - name: Package Release Directory (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        # Переходим в директорию сборки, где лежит папка dist с бинарниками и ассетами
        cd build
        zip -r ../${{ matrix.artifact_name }}.zip dist/

    - name: Package Release Directory (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Архивируем папку dist средствами PowerShell для Windows
        cd build
        Expand-Archive -Path "dist" -DestinationPath "../" # или Compress-Archive
        Compress-Archive -Path "dist" -DestinationPath "../${{ matrix.artifact_name }}.zip" -Force

    # --- ЗАГРУЗКА В РЕЛИЗ GITHUB ---
    - name: Upload Binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
