name: Create Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Upload Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux-x64
          - os: macos-latest
            artifact_name: eaglenest-macos-x64
          - os: windows-latest
            artifact_name: eaglenest-windows-x64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- СБОРКА ПОД LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config gcc libasound2-dev libpulse-dev

    - name: Build and Install SDL3 from Source (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        git clone https://github.com --depth=1 -b main
        cd SDL
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        sudo cmake --build . --target install
        sudo ldconfig

    - name: Build Linux Project
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x build_linux.sh
        ./build_linux.sh

    # --- СБОРКА ПОД MACOS ---
    - name: Install macOS Dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake pkg-config sdl3

    - name: Build macOS Project
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x build_macos.sh
        ./build_macos.sh

    # --- СБОРКА ПОД WINDOWS (MSVC) ---
    - name: Download SDL3 Development Pack for Compilation
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com" -OutFile "sdl3_devel.zip"
        Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "C:\SDL3"

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DSDL3_DIR="C:/SDL3/SDL3-devel-3.2.0-VC/SDL3-3.2.0/cmake" `
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

    - name: Build Project (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cmake --build build --config Release

    - name: Prepare Windows Dist Folder
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        Copy-Item -Path "libs/SDL3.dll" -Destination "build/dist/" -Force

    # --- УПАКОВКА АРТЕФАКТОВ ---
    - name: Package Release Directory (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd build
        zip -r ../${{ matrix.artifact_name }}.zip dist/

    - name: Package Release Directory (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cd build
        Compress-Archive -Path "dist" -DestinationPath "../${{ matrix.artifact_name }}.zip" -Force

    # --- ЗАГРУЗКА В РЕЛИЗ GITHUB ---
    - name: Upload Binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
