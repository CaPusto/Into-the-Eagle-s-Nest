name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push tags like v1.0.0

permissions:
  contents: write # Required to upload assets to the release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev

      # --- MACOS DEPENDENCIES ---
      - name: Install macOS Build Tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # --- UNIX SDL3 SETUP (Linux & macOS only) ---
      # For Linux and macOS, the official setup-sdl action works perfectly out of the box
      - name: Setup SDL3 (Unix)
        if: matrix.os != 'windows-latest'
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest

      # --- WINDOWS PRE-COMPILED SDL3 SETUP ---
      # Instead of building SDL3 from source, we download the official pre-compiled x64 binaries
      - name: Download Official SDL3 Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "sdl3.zip"
          Expand-Archive -Path "sdl3.zip" -DestinationPath "sdl3_dev"
          
          # Create a directory where CMake will look for SDL3Config.cmake
          mkdir sdl3_dev/cmake
          Move-Item "sdl3_dev/lib/x64/cmake/SDL3/*" -Destination "sdl3_dev/cmake"
          
          # Expose the download path to the global environment variables for the next steps
          echo "SDL3_DIR=$((Get-Item .).FullName)/sdl3_dev/cmake" >> $env:GITHUB_ENV
          echo "SDL3_BINARY_DIR=$((Get-Item .).FullName)/sdl3_dev/lib/x64" >> $env:GITHUB_ENV

      # --- COMPILATION ---
      
      # Standard Unix compilation (Linux/macOS)
      - name: Configure and Build (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          cmake --build .

      # Windows compilation using native MSVC, linking against the downloaded official SDL3
      - name: Configure and Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir build && cd build
          # We pass the downloaded SDL3 path to CMake so it links against the official production DLL
          cmake .. -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="${{ env.SDL3_DIR }}"
          cmake --build . --config Release
          
          # Copy the official production SDL3.dll right next to the compiled executable
          Copy-Item "${{ env.SDL3_BINARY_DIR }}/SDL3.dll" -Destination "dist/"

      # --- PACKAGING ---
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Temporarily store the created archives for the release job
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
