name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write # Required to create a release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents one OS failure from cancelling other OS builds
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- INSTALL SYSTEM DEPENDENCIES ---
      
      # Install required build tools and audio development libraries for Linux
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev

      # Install standard build tools for macOS using Homebrew
      - name: Install macOS Build Tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # Install ninja and pkg-config lite via Chocolatey package manager for Windows
      - name: Install Windows Build Tools
        if: matrix.os == 'windows-latest'
        run: |
          choco install pkgconfiglite ninja

      # --- SETUP SDL3 ---

      # Official action to automatically download and configure the latest SDL3 build
      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest

      # --- PROJECT COMPILATION ---

      # Configure and compile the project using CMake and Ninja
      # Added C flags to prevent compiler warnings (like unused fread results) from breaking the build
      - name: Configure and Build
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          ninja

      # --- PACKAGING ARTIFACTS ---

      # Pack built binaries and the assets/ folder into a .tar.gz archive for Unix-like systems
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      # Pack built binaries and the assets/ folder into a .zip archive for Windows
      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Temporarily store the created archives so the next release job can access them
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Fetch all packaged archives from the build stage
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Diagnostic step to verify downloaded files in CI logs
      - name: Display downloaded files
        run: ls -R artifacts

      # Automatically generate a GitHub Release based on your git tag and upload the built games
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
