name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag push starting with 'v' (e.g., v1.0.0)

permissions:
  contents: write # Required to create a release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ENVIRONMENT SETUP ---
    
    # Linux (Ubuntu) setup with manual SDL3 installation from GitHub
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config gcc ninja-build libasound2-dev libpulse-dev
        # Download and install official SDL3 release since it is missing in apt
        wget https://github.com
        tar -xzf SDL3-3.2.0.tar.gz
        cd SDL3-3.2.0
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
        sudo cmake --build . --target install
        sudo ldconfig

    # Windows (MSYS2/MinGW64) setup
    - name: Set up MSYS2 (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-sdl3

    # macOS setup
    - name: Install macOS Dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake pkg-config sdl3

    # --- COMPILATION ---

    # Standard CMake build for Linux and macOS
    - name: Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    # Windows build using the repository batch script inside MSYS2 bash
    - name: Build (Windows MINGW64)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        ./build_windows_mingw.bat

    # --- PACKAGING ---

    # Pack Linux/macOS binaries into .tar.gz
    - name: Archive Production Artifacts (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd ${{ matrix.asset_path }}
        tar -czf ../../${{ matrix.artifact_name }}.tar.gz .
        cd ../..

    # Pack Windows files (Running strictly inside MSYS2 shell to ensure right paths)
    - name: Archive Production Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        cd build/dist
        tar -caf ../../eaglenest-windows.zip *
