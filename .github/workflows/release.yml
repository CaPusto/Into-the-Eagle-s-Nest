name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev

      # --- MACOS DEPENDENCIES ---
      - name: Install macOS Build Tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # --- SETUP SDL3 FOR UNIX (Linux/macOS) ---
      - name: Setup SDL3 (Unix)
        if: matrix.os != 'windows-latest'
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest

      # --- WINDOWS SETUP (Temporary Devel Files for Compiler Only) ---
      - name: Download SDL3 Devel files for Windows Build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL"
          Invoke-WebRequest -Uri $url -OutFile "sdl3_devel.zip"
          Expand-Archive -Path "sdl3_devel.zip" -DestinationPath "sdl3_devel"
          # Find the exact path to CMake configs in the extracted devel folder
          $cfgPath = (Get-ChildItem -Path "sdl3_devel" -Filter "SDL3Config.cmake" -Recurse).Directory.FullName
          echo "SDL3_DIR=$cfgPath" >> $env:GITHUB_ENV

      # --- COMPILATION ---
      
      # Standard Unix compilation (Linux/macOS)
      - name: Configure and Build (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          cmake --build .

      # Windows compilation using MSVC pointing to the temporary devel config
      - name: Configure and Build (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir build && cd build
          # Pass SDL3_DIR to CMake so find_package works successfully without pkg-config
          cmake .. -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="${{ env.SDL3_DIR }}"
          cmake --build . --config Release
          
          # Create target dist folder if CMake didn't create it during configuration
          if (-not (Test-Path "dist")) { mkdir "dist" }
          
          # Copy your custom, production-ready SDL3.dll from the repository libs/ directory
          if (Test-Path "../libs/SDL3.dll") {
            Copy-Item "../libs/SDL3.dll" -Destination "dist/"
          }

      # --- PACKAGING ---
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Temporarily store the created archives
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
