name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eaglenest-linux
            asset_path: build/dist
          - os: windows-latest
            artifact_name: eaglenest-windows
            asset_path: build/dist
          - os: macos-latest
            artifact_name: eaglenest-macos
            asset_path: build/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка системных утилит сборки
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libpulse-dev

      - name: Install macOS Build Tools
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # Исправление для Windows: ставим pkg-config через Chocolatey
      - name: Install Windows Build Tools
        if: matrix.os == 'windows-latest'
        run: |
          choco install pkgconfiglite ninja

      # Официальный экшен для автоматической настройки SDL3
      # Добавлен параметр ИСКЛЮЧИТЕЛЬНО релизной сборки (build-types: Release)
      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest
          build-types: Release

      # Сборка проекта
      # Добавлен явный флаг -DCMAKE_BUILD_TYPE=Release для конфигурации компилятора
      - name: Configure and Build
        shell: bash
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_C_FLAGS="-Wno-error=unused-result -Wno-unused-result"
          ninja

      # Архивируем собранный проект вместе с папкой assets
      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ matrix.asset_path }}
          tar -czf ../../${{ matrix.artifact_name }}.tar.gz .

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location ${{ matrix.asset_path }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact_name }}.zip

      # Временное сохранение артефактов для шага релиза
      - name: Upload Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
