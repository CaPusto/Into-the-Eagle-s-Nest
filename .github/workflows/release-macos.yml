name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS x64
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install macOS Dependencies
      run: |
        brew install cmake pkg-config sdl3

    - name: Build macOS Project
      run: |
        chmod +x build_macos.sh
        ./build_macos.sh

    - name: Create and Package App Bundle
      run: |
        mkdir -p IntoTheEaglesNest.app/Contents/MacOS
        mkdir -p IntoTheEaglesNest.app/Contents/Resources
        
        cp build/dist/eaglenest IntoTheEaglesNest.app/Contents/MacOS/
        cp build/dist/mapview IntoTheEaglesNest.app/Contents/MacOS/
        
        # Fixed: Copy assets directly from the repository root directory
        cp -r assets IntoTheEaglesNest.app/Contents/Resources/
        
        cat <<EOF > IntoTheEaglesNest.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>eaglenest</string>
            <key>CFBundleIdentifier</key>
            <string>com.capusto.intotheeaglesnest</string>
            <key>CFBundleName</key>
            <string>Into the Eagle's Nest</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        zip -r ../eaglenest-macos-x64.zip IntoTheEaglesNest.app/

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-macos-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
