name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS x64
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install macOS Dependencies
      run: |
        brew install cmake pkg-config sdl3

    - name: Build macOS Project
      run: |
        chmod +x build_macos.sh
        ./build_macos.sh

    - name: Create and Package App Bundle
      run: |
        mkdir -p IntoTheEaglesNest.app/Contents/MacOS
        mkdir -p IntoTheEaglesNest.app/Contents/Resources
        
        # Copy compiled binaries
        cp build/dist/eaglenest IntoTheEaglesNest.app/Contents/MacOS/
        cp build/dist/mapview IntoTheEaglesNest.app/Contents/MacOS/
        
        # Ensure executable permissions are preserved
        chmod +x IntoTheEaglesNest.app/Contents/MacOS/eaglenest
        chmod +x IntoTheEaglesNest.app/Contents/MacOS/mapview
        
        # Copy assets
        cp -r assets IntoTheEaglesNest.app/Contents/Resources/
        
        # Copy your ready-made Apple Icon directly to Resources
        cp src/resources/appicon.icns IntoTheEaglesNest.app/Contents/Resources/
        
        # Generate clean Info.plist pointing to the icon
        cat <<EOF > IntoTheEaglesNest.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>eaglenest</string>
            <key>CFBundleIconFile</key>
            <string>appicon.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.capusto.intotheeaglesnest</string>
            <key>CFBundleName</key>
            <string>Into the Eagle's Nest</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # Package into DMG
        mkdir dmg_root
        mv IntoTheEaglesNest.app dmg_root/
        hdiutil create -volname "Into the Eagles Nest" -srcfolder dmg_root -ov -format UDZO eaglenest-macos.dmg

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: eaglenest-macos.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
